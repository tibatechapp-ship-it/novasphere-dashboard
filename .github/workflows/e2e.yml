name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-e2e.txt
      - run: playwright install --with-deps chromium
      - name: Start app + seed user
        env:
          JWT_SECRET_KEY: e2e-secret-32-chars-minimum-abcdefgh
          ENV: development
          MOCK_DATA: "true"
          REDIS_URL: redis://localhost:6379/0
        run: |
          alembic upgrade head
          uvicorn app.main:app --port 8080 &
          sleep 3
          curl -s -X POST -d "username=e2euser&password=secret123" http://127.0.0.1:8080/api/auth/signup || true
      - name: Run E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: pytest tests/e2e -v
