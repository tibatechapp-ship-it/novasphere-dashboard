name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.47.0-noble
      options: --user root
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install -r requirements.txt -r requirements-e2e.txt

      - name: Start app + seed user
        env:
          JWT_SECRET_KEY: e2e-secret-32-chars-minimum-abcdefgh
          ENV: development
          MOCK_DATA: "true"
          REDIS_URL: redis://redis:6379/0
        run: |
          alembic upgrade head
          uvicorn app.main:app --port 8080 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done
          curl -s -X POST -d "username=e2euser&password=secret123" \
            http://localhost:8080/api/auth/signup || true

      - name: Run E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: pytest tests/e2e -v
