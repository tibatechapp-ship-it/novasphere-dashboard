name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # ← يمنع التعليق 6 ساعات
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      - run: pip install -r requirements.txt -r requirements-e2e.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements-e2e.txt') }}

      - name: Install Playwright Chromium
        timeout-minutes: 5       # ← يقتل apt المعلّق بعد 5 دقائق
        run: playwright install --with-deps chromium

      - name: Start app + seed user
        env:
          JWT_SECRET_KEY: e2e-secret-32-chars-minimum-abcdefgh
          ENV: development
          MOCK_DATA: "true"
          REDIS_URL: redis://localhost:6379/0
        run: |
          alembic upgrade head
          uvicorn app.main:app --port 8080 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done
          curl -s -X POST -d "username=e2euser&password=secret123" \
            http://localhost:8080/api/auth/signup || true

      - name: Run E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: pytest tests/e2e -v
