name: Integration (Postgres)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: raqib
          POSTGRES_PASSWORD: test
          POSTGRES_DB: raqib_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://raqib:test@localhost:5432/raqib_test
      JWT_SECRET_KEY: test-secret-32-chars-minimum-abcdefghij
      ENV: development
      MOCK_DATA: "false"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest tests/integration -v --tb=short
