<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رقيب — لوحة تحكم تحليلية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#ecfeff', 100: '#cffafe', 200: '#a5f3fc', 300: '#67e8f9', 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2', 700: '#0e7490', 800: '#155e75', 900: '#164e63' },
            surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 850: '#151f32', 900: '#0f172a', 950: '#020617' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Tahoma', 'sans-serif'] },
          boxShadow: { 'glow': '0 0 20px rgba(6,182,212,0.15)', 'card': '0 4px 24px rgba(0,0,0,0.4)' }
        }
      }
    }
  </script>
  <script src="/static/js/chart.umd.js"></script>
  <script defer src="/static/js/alpine.min.js"></script>
  <script defer src="/static/js/runbook-ui.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    [x-cloak] { display: none !important; }
    body {
      background: radial-gradient(ellipse at 20% 0%, #0c1a2e 0%, #020617 60%);
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .glass {
      backdrop-filter: blur(16px) saturate(180%);
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.08);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .glass-card {
      backdrop-filter: blur(12px);
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.06);
      transition: all 0.2s ease;
    }
    .glass-card:hover {
      border-color: rgba(6, 182, 212, 0.2);
      box-shadow: 0 0 20px rgba(6,182,212,0.08);
    }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .metric-value { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    .gradient-text { background: linear-gradient(135deg, #22d3ee, #06b6d4, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .btn-primary { background: linear-gradient(135deg, #06b6d4, #0891b2); transition: all 0.2s; }
    .btn-primary:hover { background: linear-gradient(135deg, #22d3ee, #06b6d4); box-shadow: 0 0 20px rgba(6,182,212,0.3); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .input-field { background: rgba(15,23,42,0.8); border: 1px solid rgba(148,163,184,0.15); transition: border-color 0.2s, box-shadow 0.2s; }
    .input-field:focus { border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6,182,212,0.1); outline: none; }
    .sidebar-item { transition: all 0.15s ease; }
    .sidebar-item:hover { background: rgba(6,182,212,0.08); }
    .sidebar-item.active { background: rgba(6,182,212,0.12); border-right: 2px solid #06b6d4; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4,0,0.6,1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.2); border-radius: 2px; }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,0.4); }
    .toast { animation: slideIn 0.3s ease-out, fadeOut 0.3s ease-in 2.7s forwards; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  </style>
</head>
<body class="text-slate-200" x-data="{ ...runbookUI(), ...raqibApp() }">

  <!-- AUTH VIEW -->
  <div x-show="!authenticated" x-transition class="min-h-screen flex items-center justify-center p-6">
    <div class="glass rounded-2xl p-8 w-full max-w-md shadow-2xl">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-cyan-500 to-purple-600 mb-4 shadow-glow">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
        </div>
        <h1 class="text-3xl font-bold gradient-text mb-1">رقيب</h1>
        <p class="text-slate-400 text-sm">لوحة تحكم تحليلية فورية</p>
      </div>

      <div class="flex gap-1 mb-6 bg-slate-800/50 rounded-lg p-1">
        <button type="button" @click="authMode='login'" :class="authMode==='login' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'" class="flex-1 py-2 rounded-md text-sm font-medium transition">دخول</button>
        <button type="button" @click="authMode='signup'" :class="authMode==='signup' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'" class="flex-1 py-2 rounded-md text-sm font-medium transition">إنشاء حساب</button>
      </div>

      <form @submit.prevent="authMode === 'login' ? login() : signup()" class="space-y-4">
        <div>
          <label for="username" class="block text-xs font-medium text-slate-400 mb-1.5">اسم المستخدم</label>
          <input id="username" name="username" type="text" x-model="form.username" required minlength="3" maxlength="32" autocomplete="username" class="input-field w-full rounded-lg px-3.5 py-2.5 text-slate-200 text-sm" placeholder="أدخل اسم المستخدم" />
        </div>
        <div>
          <label for="password" class="block text-xs font-medium text-slate-400 mb-1.5">كلمة المرور</label>
          <input id="password" name="password" type="password" x-model="form.password" required minlength="6" autocomplete="current-password" class="input-field w-full rounded-lg px-3.5 py-2.5 text-slate-200 text-sm" placeholder="••••••••" />
        </div>
        <p x-show="authError" x-text="authError" class="text-red-400 text-xs bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2" role="alert"></p>
        <button type="submit" :disabled="authBusy" class="btn-primary w-full py-2.5 rounded-lg text-white font-medium text-sm shadow-glow">
          <span x-show="!authBusy" x-text="authMode === 'login' ? 'تسجيل الدخول' : 'إنشاء الحساب'"></span>
          <span x-show="authBusy" class="flex items-center justify-center gap-2">
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
            جارٍ...
          </span>
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-800/50 text-center">
        <p class="text-[11px] text-slate-600">رقيب v0.4.2 — منصة مراقبة ذكية</p>
      </div>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div x-show="authenticated" x-transition data-testid="dashboard" class="min-h-screen">
    <!-- Top Navigation Bar -->
    <nav class="sticky top-0 z-50 glass border-b border-slate-800/50 px-4 md:px-6 py-3">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-500 to-purple-600 flex items-center justify-center shadow-glow">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-lg font-bold text-white">رقيب</h1>
            <p class="text-[10px] text-slate-500">لوحة تحكم تحليلية</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span class="hidden md:flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse-slow"></span>
            <span x-text="wsConnected ? 'متصل' : 'منقطع'"></span>
          </span>
          <div class="flex items-center gap-2 text-xs text-slate-400">
            <div class="w-7 h-7 rounded-full bg-gradient-to-br from-cyan-500/30 to-purple-500/30 flex items-center justify-center text-cyan-400 font-bold text-xs" x-text="username.charAt(0).toUpperCase()"></div>
            <span x-text="username" class="hidden sm:inline"></span>
          </div>
          <button type="button" @click="logout()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800/70 hover:bg-slate-700 text-slate-300 border border-slate-700/50 transition">خروج</button>
        </div>
      </div>
    </nav>

    <div class="max-w-7xl mx-auto p-4 md:p-6">
      <!-- Metric Cards -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        <template x-for="m in metricCards()" :key="m.key">
          <div class="glass-card rounded-xl p-4 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-20 h-20 rounded-full opacity-10" :class="m.bgGlow"></div>
            <p class="text-xs text-slate-400 mb-1 font-medium" x-text="m.label"></p>
            <div class="flex items-baseline gap-1">
              <p class="text-2xl font-bold metric-value" :class="m.textColor" x-text="m.value"></p>
              <span class="text-xs text-slate-500" x-text="m.unit"></span>
            </div>
            <div class="mt-2 h-1 rounded-full bg-slate-800 overflow-hidden">
              <div class="h-full rounded-full transition-all duration-500" :class="m.barColor" :style="'width:' + m.barWidth + '%'"></div>
            </div>
          </div>
        </template>
      </div>

      <!-- Charts -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
        <div class="glass rounded-xl p-4">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold text-slate-200">CPU / MEM %</h3>
            <span class="text-[10px] text-slate-500">آخر 30 نقطة</span>
          </div>
          <div class="h-48"><canvas id="chartResources"></canvas></div>
        </div>
        <div class="glass rounded-xl p-4">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold text-slate-200">RPS / Latency</h3>
            <span class="text-[10px] text-slate-500">آخر 30 نقطة</span>
          </div>
          <div class="h-48"><canvas id="chartThroughput"></canvas></div>
        </div>
      </div>

      <!-- Smart Runbook Card -->
      <section
        x-show="insightsLoaded"
        x-transition
        data-testid="runbook-card"
        class="glass rounded-xl p-6 border-l-4 shadow-card mb-6 animate-fade-in"
        :class="insights.runbook ? severityClass(insights.runbook.severity) : 'border-slate-600 bg-slate-800/20'"
        role="region"
        :aria-label="insights.runbook ? ('دليل معالجة: ' + insights.runbook.title) : 'تحليل النظام'"
      >
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
          <div class="flex items-center gap-3 flex-wrap">
            <span
              data-testid="severity-badge"
              class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md"
              :class="insights.runbook ? severityBadgeClass(insights.runbook.severity) : 'bg-slate-600/30 text-slate-300'"
              x-text="insights.runbook ? severityLabel(insights.runbook.severity) : 'INFO'"
            ></span>
            <h3 class="text-lg font-semibold text-white" x-text="insights.runbook?.title ?? 'تحليل ذكي'"></h3>
          </div>
          <span class="text-xs text-slate-500 bg-slate-800/50 px-2 py-1 rounded" x-text="insights.runbook?.steps?.length ? insights.runbook.steps.length + ' خطوات' : ''"></span>
        </div>

        <p class="text-slate-300 text-sm mb-4 leading-relaxed" x-text="insights.summary"></p>

        <template x-if="insights.runbook?.steps?.length">
          <ol class="space-y-3 mb-4" role="list" data-testid="steps-list">
            <template x-for="(step, i) in insights.runbook.steps" :key="i">
              <li class="flex gap-3 items-start p-3 rounded-lg bg-slate-800/30 border border-slate-700/30" data-testid="runbook-step">
                <span class="flex-shrink-0 w-7 h-7 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 text-white flex items-center justify-center text-xs font-bold shadow-sm" aria-hidden="true" x-text="i + 1"></span>
                <div class="flex-1 min-w-0">
                  <p class="text-slate-200 text-sm leading-relaxed" x-text="step.step"></p>
                  <template x-if="step.command">
                    <div class="mt-2 flex items-center gap-2">
                      <code class="flex-1 text-xs bg-slate-900/80 text-cyan-300 px-3 py-2 rounded-lg font-mono overflow-x-auto border border-slate-700/50" data-testid="command-text" x-text="step.command"></code>
                      <button
                        type="button"
                        class="flex-shrink-0 text-xs px-2.5 py-2 rounded-lg bg-slate-700/80 hover:bg-slate-600 text-slate-300 transition border border-slate-600/50 min-w-[2rem]"
                        :aria-label="'نسخ الأمر ' + (i+1)"
                        :aria-describedby="'copy-hint-' + i"
                        @click="copyToClipboard(step.command)"
                        data-testid="copy-button"
                      >
                        <span x-show="copiedIndex !== step.command" aria-hidden="true">📋</span>
                        <span x-show="copiedIndex === step.command" aria-hidden="true">✓</span>
                      </button>
                      <span :id="'copy-hint-' + i" class="sr-only">ينسخ الأمر إلى الحافظة</span>
                    </div>
                  </template>
                </div>
              </li>
            </template>
          </ol>
        </template>

        <template x-if="insights.runbook?.action_url">
          <a
            :href="insights.runbook.action_url"
            @click="trackActionClick(insights.runbook.id ?? insights.runbook.title)"
            target="_blank"
            rel="noopener noreferrer"
            data-testid="action-button"
            class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-gradient-to-r from-cyan-500/10 to-blue-500/10 text-cyan-400 border border-cyan-500/30 hover:from-cyan-500/20 hover:to-blue-500/20 transition text-sm font-medium"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>
            فتح في منصة الأتمتة
          </a>
        </template>

        <template x-if="!insights.runbook">
          <div class="flex items-center gap-2 text-xs text-slate-500 bg-slate-800/30 rounded-lg px-3 py-2" data-testid="empty-state">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            النظام يعمل بشكل طبيعي — آخر فحص: <span x-text="lastChecked" class="text-slate-400"></span>
          </div>
        </template>

        <p class="sr-only" role="status" aria-live="polite" x-text="copyAnnouncement"></p>
      </section>

      <!-- Agents -->
      <div class="glass rounded-xl p-5 mb-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-semibold text-slate-200">الوكلاء</h3>
          <span class="text-[10px] text-slate-500 bg-slate-800/50 px-2 py-1 rounded" x-text="agents.length + ' وكيل'"></span>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <template x-for="a in agents" :key="a.id">
            <div class="glass-card rounded-lg p-3">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-cyan-400" x-text="a.id"></span>
                <span class="text-[10px] px-1.5 py-0.5 rounded-full" :class="agentStatusClass(a.status)" x-text="a.status"></span>
              </div>
              <p class="text-sm text-slate-300 truncate font-medium" x-text="a.name"></p>
              <div class="mt-2.5 space-y-1.5">
                <div class="flex justify-between text-[11px] text-slate-500">
                  <span>حمل</span>
                  <span x-text="a.load + '%'"></span>
                </div>
                <div class="h-1 rounded-full bg-slate-800 overflow-hidden">
                  <div class="h-full rounded-full bg-gradient-to-r from-cyan-500 to-blue-500 transition-all duration-500" :style="'width:' + a.load + '%'"></div>
                </div>
                <div class="flex justify-between text-[11px] text-slate-500">
                  <span>مهام</span>
                  <span class="text-slate-300" x-text="a.tasks"></span>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Events -->
      <div class="glass rounded-xl p-5 mb-6">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold text-slate-200">سجل الأحداث</h3>
          <span class="text-[10px] text-slate-500" x-text="events.length + ' حدث'"></span>
        </div>
        <ul class="space-y-2 max-h-64 overflow-y-auto scrollbar-thin">
          <template x-for="(ev, i) in events" :key="i">
            <li class="flex items-start gap-2 text-xs p-2 rounded-lg hover:bg-slate-800/30 transition">
              <span class="flex-shrink-0 px-1.5 py-0.5 rounded text-[10px] font-bold" :class="eventLevelClass(ev.level)" x-text="ev.level"></span>
              <span class="text-slate-500 flex-shrink-0 font-mono text-[10px]" x-text="formatTime(ev.ts)"></span>
              <span class="text-slate-300" x-text="ev.msg"></span>
            </li>
          </template>
          <li x-show="events.length === 0" class="text-slate-500 text-xs italic text-center py-4">لا أحداث بعد...</li>
        </ul>
      </div>

      <!-- Audit log viewer -->
      <div class="glass rounded-xl p-5">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
          <h3 class="text-sm font-semibold text-slate-200">سجل الحوكمة</h3>
          <div class="flex items-center gap-2">
            <select x-model="auditFilter.action" @change="loadAudit()" class="text-xs bg-slate-800/80 border border-slate-700/50 rounded-lg px-3 py-1.5 text-slate-300 focus:border-cyan-500 focus:outline-none">
              <option value="">الكل</option>
              <option value="runbook_view">عرض Runbook</option>
              <option value="action_url_click">نقر زر الأتمتة</option>
            </select>
            <button type="button" @click="loadAudit()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700/50 transition text-slate-300">تحديث</button>
          </div>
        </div>
        <template x-if="auditRows.length === 0">
          <div class="text-center py-6">
            <svg class="w-8 h-8 text-slate-600 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <p class="text-xs text-slate-500 italic">لا سجلات بعد.</p>
          </div>
        </template>
        <template x-if="auditRows.length > 0">
          <div class="overflow-x-auto">
            <table class="w-full text-xs">
              <thead class="text-slate-400 border-b border-slate-700/50">
                <tr>
                  <th class="text-right py-2.5 px-3 font-medium">الوقت</th>
                  <th class="text-right py-2.5 px-3 font-medium">الإجراء</th>
                  <th class="text-right py-2.5 px-3 font-medium">الهدف</th>
                  <th class="text-right py-2.5 px-3 font-medium">تفاصيل</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in auditRows" :key="row.id">
                  <tr class="border-b border-slate-800/30 hover:bg-slate-800/20 transition">
                    <td class="py-2 px-3 text-slate-400 font-mono text-[10px]" x-text="new Date(row.ts).toLocaleString()"></td>
                    <td class="py-2 px-3"><span class="px-2 py-0.5 rounded-md bg-cyan-500/15 text-cyan-400 text-[10px] font-medium" x-text="row.action"></span></td>
                    <td class="py-2 px-3 text-slate-300" x-text="row.target"></td>
                    <td class="py-2 px-3 text-slate-500 font-mono text-[10px] max-w-[200px] truncate" x-text="row.metadata_json ? JSON.stringify(row.metadata_json) : '—'"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <p class="text-xs text-slate-500 mt-3 text-center" x-text="auditTotal + ' سجل — صفحة ' + auditPage"></p>
          </div>
        </template>
      </div>

      <!-- Footer -->
      <footer class="mt-8 pt-4 border-t border-slate-800/50 text-center">
        <p class="text-[11px] text-slate-600">رقيب v0.4.2 — منصة مراقبة ذكية بالذكاء الاصطناعي</p>
      </footer>
    </div>
  </div>

  <script>
    function raqibApp() {
      return {
        authenticated: false,
        username: "",
        authMode: "login",
        authBusy: false,
        authError: "",
        form: { username: "", password: "" },
        metrics: { cpu: 0, mem: 0, req_per_sec: 0, latency_ms: 0 },
        agents: [],
        events: [],
        wsConnected: false,
        ws: null,
        wsReconnectTimer: null,
        insights: {},
        insightsLoaded: false,
        lastChecked: "—",
        insightsTimer: null,
        lastRunbookKey: null,
        copiedIndex: null,
        copyAnnouncement: "",
        chartResources: null,
        chartThroughput: null,
        maxPoints: 30,
        auditRows: [],
        auditTotal: 0,
        auditPage: 1,
        auditFilter: { action: "" },

        async init() {
          try {
            const r = await fetch("/api/events?limit=1", { credentials: "include" });
            if (r.ok) {
              this.authenticated = true;
              this.initCharts();
              this.connectWS();
              this.startInsightsLoop();
              this.loadAudit();
            }
          } catch (_) {}
        },

        initCharts() {
          this.$nextTick(() => {
            const ctx1 = document.getElementById("chartResources");
            const ctx2 = document.getElementById("chartThroughput");
            if (!ctx1 || !ctx2) return;
            const chartOpts = {
              responsive: true, maintainAspectRatio: false, animation: false,
              plugins: { legend: { labels: { color: "#94a3b8", font: { size: 10, family: "Inter" } } } },
              scales: { x: { display: false }, y: { ticks: { color: "#64748b", font: { size: 9 } }, grid: { color: "rgba(148,163,184,0.06)" } } }
            };
            this.chartResources = new Chart(ctx1, {
              type: "line",
              data: { labels: [], datasets: [
                { label: "CPU %", data: [], borderColor: "#22d3ee", backgroundColor: "rgba(34,211,238,0.08)", tension: 0.4, fill: true, pointRadius: 0, borderWidth: 2 },
                { label: "MEM %", data: [], borderColor: "#a855f7", backgroundColor: "rgba(168,85,247,0.08)", tension: 0.4, fill: true, pointRadius: 0, borderWidth: 2 }
              ]},
              options: { ...chartOpts, scales: { ...chartOpts.scales, y: { ...chartOpts.scales.y, min: 0, max: 100 } } }
            });
            this.chartThroughput = new Chart(ctx2, {
              type: "line",
              data: { labels: [], datasets: [
                { label: "RPS", data: [], borderColor: "#22d3ee", backgroundColor: "rgba(34,211,238,0.08)", tension: 0.4, fill: true, pointRadius: 0, borderWidth: 2, yAxisID: "y" },
                { label: "Latency ms", data: [], borderColor: "#f59e0b", backgroundColor: "rgba(245,158,11,0.08)", tension: 0.4, fill: true, pointRadius: 0, borderWidth: 2, yAxisID: "y1" }
              ]},
              options: { ...chartOpts, scales: { ...chartOpts.scales, y: { ...chartOpts.scales.y, position: "left" }, y1: { ...chartOpts.scales.y, position: "right", grid: { display: false } } } }
            });
          });
        },

        async login() { await this._auth("/api/auth/login"); },
        async signup() { await this._auth("/api/auth/signup"); },

        async _auth(endpoint) {
          this.authBusy = true;
          this.authError = "";
          try {
            const body = new URLSearchParams(this.form);
            const r = await fetch(endpoint, { method: "POST", credentials: "include", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body });
            if (!r.ok) { const data = await r.json().catch(() => ({})); this.authError = data.detail || "فشل التحقق"; return; }
            const data = await r.json();
            this.username = this.form.username;
            this.authenticated = true;
            this.form = { username: "", password: "" };
            this.initCharts();
            this.connectWS();
            this.startInsightsLoop();
            this.loadAudit();
          } catch (e) { this.authError = "خطأ في الاتصال"; }
          finally { this.authBusy = false; }
        },

        async logout() {
          try { await fetch("/api/auth/logout", { method: "POST", credentials: "include" }); } catch (_) {}
          if (this.ws) this.ws.close();
          if (this.insightsTimer) clearInterval(this.insightsTimer);
          this.authenticated = false;
          this.wsConnected = false;
        },

        connectWS() {
          if (this.ws && this.ws.readyState <= 1) return;
          const proto = location.protocol === "https:" ? "wss" : "ws";
          try { this.ws = new WebSocket(proto + "://" + location.host + "/ws"); } catch (_) { return; }
          this.ws.onopen = () => { this.wsConnected = true; };
          this.ws.onclose = () => { this.wsConnected = false; if (this.authenticated) this.wsReconnectTimer = setTimeout(() => this.connectWS(), 2000); };
          this.ws.onerror = () => { this.wsConnected = false; };
          this.ws.onmessage = (e) => { try { this.handleWSMessage(JSON.parse(e.data)); } catch (_) {} };
        },

        handleWSMessage(payload) {
          this.metrics = { cpu: payload.cpu ?? 0, mem: payload.mem ?? 0, req_per_sec: payload.req_per_sec ?? 0, latency_ms: payload.latency_ms ?? 0 };
          if (Array.isArray(payload.agents)) this.agents = payload.agents;
          if (Array.isArray(payload.events)) this.events = [...payload.events.slice().reverse(), ...this.events].slice(0, 50);
          this.pushChartPoints();
        },

        pushChartPoints() {
          if (!this.chartResources || !this.chartThroughput) return;
          const push = (chart, values) => {
            chart.data.labels.push("");
            values.forEach((v, i) => chart.data.datasets[i].data.push(v));
            if (chart.data.labels.length > this.maxPoints) { chart.data.labels.shift(); chart.data.datasets.forEach(ds => ds.data.shift()); }
            chart.update("none");
          };
          push(this.chartResources, [this.metrics.cpu, this.metrics.mem]);
          push(this.chartThroughput, [this.metrics.req_per_sec, this.metrics.latency_ms]);
        },

        startInsightsLoop() {
          if (this.insightsTimer) clearInterval(this.insightsTimer);
          this.fetchInsights();
          this.insightsTimer = setInterval(() => this.fetchInsights(), 5000);
        },

        async fetchInsights() {
          try {
            const r = await fetch("/api/insights", { method: "POST", credentials: "include", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ events: this.events.slice(0, 10), metrics: this.metrics }) });
            if (!r.ok) return;
            const data = await r.json();
            this.insights = data;
            this.insightsLoaded = true;
            this.lastChecked = new Date().toLocaleTimeString();
            if (data.runbook) {
              const key = (data.runbook.id || data.runbook.title) + ":" + data.runbook.severity;
              if (key !== this.lastRunbookKey) {
                this.lastRunbookKey = key;
                this.trackRunbookView(data.runbook);
              }
            }
          } catch (_) {}
        },

        trackRunbookView(runbook) {
          if (!runbook) return;
          fetch("/api/audit/runbook-view", { method: "POST", credentials: "include", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ runbook_id: runbook.id || runbook.title, severity: runbook.severity }) }).catch(() => {});
        },

        trackActionClick(runbookId) {
          if (!runbookId) return;
          fetch("/api/audit/action-url-click", { method: "POST", credentials: "include", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ runbook_id: runbookId }) }).catch(() => {});
        },

        async copyToClipboard(text) {
          if (!text) return;
          const showSuccess = () => {
            this.copiedIndex = text;
            this.copyAnnouncement = "تم النسخ إلى الحافظة";
            setTimeout(() => { this.copiedIndex = null; this.copyAnnouncement = ""; }, 1500);
          };
          if (navigator.clipboard && window.isSecureContext) {
            try { await navigator.clipboard.writeText(text); showSuccess(); return; } catch (_) {}
          }
          try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            showSuccess();
          } catch (_) {}
        },

        async loadAudit() {
          try {
            const params = new URLSearchParams({ page: this.auditPage, page_size: 50 });
            if (this.auditFilter.action) params.set("action", this.auditFilter.action);
            const r = await fetch("/api/audit/log?" + params, { credentials: "include" });
            if (!r.ok) return;
            const data = await r.json();
            this.auditRows = data.rows;
            this.auditTotal = data.total;
          } catch (_) {}
        },

        metricCards() {
          return [
            { key: "cpu", label: "CPU", value: this.metrics.cpu.toFixed(1), unit: "%", bgGlow: "bg-cyan-500", barColor: this.metrics.cpu > 90 ? "bg-red-500" : this.metrics.cpu > 70 ? "bg-amber-500" : "bg-cyan-500", textColor: this.metrics.cpu > 90 ? "text-red-400" : "text-slate-100", barWidth: Math.min(this.metrics.cpu, 100) },
            { key: "mem", label: "الذاكرة", value: this.metrics.mem.toFixed(1), unit: "%", bgGlow: "bg-purple-500", barColor: this.metrics.mem > 90 ? "bg-red-500" : "bg-purple-500", textColor: this.metrics.mem > 90 ? "text-red-400" : "text-slate-100", barWidth: Math.min(this.metrics.mem, 100) },
            { key: "rps", label: "طلبات/ث", value: this.metrics.req_per_sec.toString(), unit: "", bgGlow: "bg-cyan-500", barColor: "bg-cyan-500", textColor: "text-slate-100", barWidth: Math.min(this.metrics.req_per_sec * 2, 100) },
            { key: "lat", label: "زمن الاستجابة", value: this.metrics.latency_ms.toString(), unit: "ms", bgGlow: "bg-amber-500", barColor: this.metrics.latency_ms > 100 ? "bg-amber-500" : "bg-emerald-500", textColor: this.metrics.latency_ms > 100 ? "text-amber-400" : "text-slate-100", barWidth: Math.min(this.metrics.latency_ms, 100) }
          ];
        },

        severityClass(sev) {
          return { critical: "border-red-500 bg-red-500/5", error: "border-amber-500 bg-amber-500/5", warn: "border-cyan-500 bg-cyan-500/5" }[sev] || "border-slate-500 bg-slate-500/5";
        },
        severityBadgeClass(sev) {
          return { critical: "bg-red-500/20 text-red-400", error: "bg-amber-500/20 text-amber-400", warn: "bg-cyan-500/20 text-cyan-400" }[sev] || "bg-slate-500/20 text-slate-300";
        },
        severityLabel(sev) { return (sev || "info").toUpperCase(); },
        agentStatusClass(status) { return { online: "bg-emerald-500/20 text-emerald-400", busy: "bg-amber-500/20 text-amber-400", idle: "bg-slate-500/20 text-slate-400" }[status] || "bg-slate-700 text-slate-400"; },
        eventLevelClass(level) { return { error: "bg-red-500/20 text-red-400", warn: "bg-amber-500/20 text-amber-400", info: "bg-slate-600/30 text-slate-300" }[level] || "bg-slate-700 text-slate-400"; },
        formatTime(ts) { const d = new Date(ts * 1000); return d.toLocaleTimeString(); }
      };
    }
  </script>
</body>
</html>
