<!DOCTYPE html>
<html lang="en" x-data="dashboard()" x-init="init()">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaSphere — Real-Time AI Analytics</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { background: #05060f; }
  .grid-bg { background-image: linear-gradient(rgba(0,240,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,.04) 1px, transparent 1px); background-size: 40px 40px; }
  .glass { background: rgba(11,15,31,.6); backdrop-filter: blur(12px); border: 1px solid rgba(31,42,74,.8); }
  .neon-text { text-shadow: 0 0 10px rgba(0,240,255,.6); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body class="text-slate-100 min-h-screen grid-bg">
<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-64 glass m-2 rounded-xl p-4 flex flex-col gap-4">
    <div class="text-2xl font-extrabold tracking-widest bg-gradient-to-r from-cyan-400 to-fuchsia-500 bg-clip-text text-transparent neon-text">NovaSphere</div>
    <div class="text-xs text-slate-400">Real-Time AI Analytics</div>
    <nav class="flex flex-col gap-2 mt-4">
      <a class="px-3 py-2 rounded-lg bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-sm" href="#">Dashboard</a>
      <a class="px-3 py-2 rounded-lg hover:bg-white/5 text-slate-300 text-sm" href="#">Agents</a>
      <a class="px-3 py-2 rounded-lg hover:bg-white/5 text-slate-300 text-sm" href="#">Events</a>
      <a class="px-3 py-2 rounded-lg hover:bg-white/5 text-slate-300 text-sm" href="#">Settings</a>
    </nav>
    <div class="mt-auto text-xs text-slate-500">
      WS: <span x-text="wsStatus" :class="wsStatus==='connected'?'text-emerald-400':'text-rose-400'"></span><br>
      Clients: <span x-text="clients"></span>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col m-2 gap-2 overflow-hidden">
    <header class="glass rounded-xl px-6 py-3 flex items-center justify-between">
      <h1 class="text-lg font-bold">Live Dashboard</h1>
      <div class="flex items-center gap-4 text-sm">
        <span>CPU <b class="text-cyan-400" x-text="cpu+'%'"></b></span>
        <span>MEM <b class="text-fuchsia-400" x-text="mem+'%'"></b></span>
        <span>RPS <b class="text-emerald-400" x-text="rps"></b></span>
        <span>LAT <b class="text-amber-400" x-text="lat+'ms'"></b></span>
        <button @click="aiOpen=true" class="px-3 py-1 rounded-full border border-fuchsia-500/40 text-fuchsia-300 hover:bg-fuchsia-500/10 text-xs">🤖 AI Assistant</button>
      </div>
    </header>

    <section class="grid grid-cols-4 gap-2">
      <div class="glass rounded-xl p-4">
        <div class="text-xs text-slate-400 uppercase tracking-widest">CPU</div>
        <div class="text-3xl font-bold text-cyan-400 neon-text mt-1" x-text="cpu+'%'"></div>
      </div>
      <div class="glass rounded-xl p-4">
        <div class="text-xs text-slate-400 uppercase tracking-widest">Memory</div>
        <div class="text-3xl font-bold text-fuchsia-400 neon-text mt-1" x-text="mem+'%'"></div>
      </div>
      <div class="glass rounded-xl p-4">
        <div class="text-xs text-slate-400 uppercase tracking-widest">Req/s</div>
        <div class="text-3xl font-bold text-emerald-400 neon-text mt-1" x-text="rps"></div>
      </div>
      <div class="glass rounded-xl p-4">
        <div class="text-xs text-slate-400 uppercase tracking-widest">Latency</div>
        <div class="text-3xl font-bold text-amber-400 neon-text mt-1" x-text="lat+'ms'"></div>
      </div>
    </section>

    <section class="glass rounded-xl p-4 flex-1 overflow-hidden flex flex-col">
      <h3 class="text-sm text-cyan-400 uppercase tracking-widest mb-2">Live Metrics</h3>
      <canvas id="liveChart" class="flex-1"></canvas>
    </section>

    <section class="glass rounded-xl p-4 h-44 overflow-hidden flex flex-col">
      <h3 class="text-sm text-cyan-400 uppercase tracking-widest mb-2">Event Log</h3>
      <div class="mono text-xs overflow-y-auto flex-1 space-y-1">
        <template x-for="ev in events" :key="ev.ts+ev.msg">
          <div class="flex gap-2 border-b border-white/5 pb-1">
            <span class="text-slate-500" x-text="new Date(ev.ts*1000).toLocaleTimeString()"></span>
            <span :class="ev.level==='error'?'text-rose-400':ev.level==='warn'?'text-amber-400':'text-cyan-400'" x-text="ev.level.toUpperCase()"></span>
            <span class="text-slate-200" x-text="ev.msg"></span>
          </div>
        </template>
      </div>
    </section>
  </main>
</div>

<!-- AI Modal -->
<div x-show="aiOpen" class="fixed inset-0 bg-black/60 z-20 flex items-center justify-center" style="display:none">
  <div class="glass rounded-2xl p-6 w-[520px] max-w-[90vw]">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-fuchsia-400 font-bold">AI Assistant</h3>
      <button @click="aiOpen=false" class="text-slate-400 hover:text-white">✕</button>
    </div>
    <p class="text-xs text-slate-400 mb-3">Analyzes the last 10 events + current metrics.</p>
    <button @click="runAI()" class="px-4 py-2 rounded-lg bg-gradient-to-r from-cyan-500 to-fuchsia-500 text-black font-bold text-sm">Analyze</button>
    <div class="mt-4 mono text-xs text-slate-200 whitespace-pre-wrap min-h-[60px]" x-text="aiOut"></div>
  </div>
</div>

<script>
function dashboard() {
  return {
    wsStatus: 'connecting…',
    clients: 0,
    cpu: 0, mem: 0, rps: 0, lat: 0,
    events: [],
    aiOpen: false,
    aiOut: '',
    chart: null,
    labels: [],
    cpuData: [], memData: [], rpsData: [],
    ws: null,
    reconnectTimer: null,
    init() {
      this.initChart();
      this.connect();
    },
    initChart() {
      const ctx = document.getElementById('liveChart').getContext('2d');
      this.chart = new Chart(ctx, {
        type: 'line',
        data: { labels: this.labels, datasets: [
          { label: 'CPU %', data: this.cpuData, borderColor: '#00f0ff', tension: .3, pointRadius: 0 },
          { label: 'MEM %', data: this.memData, borderColor: '#ff2bd6', tension: .3, pointRadius: 0 },
          { label: 'Req/s', data: this.rpsData, borderColor: '#7cff6b', tension: .3, pointRadius: 0, yAxisID: 'y1' },
        ]},
        options: { animation: false, responsive: true, maintainAspectRatio: false,
          scales: { x: { display: false }, y: { min:0, max:100, ticks:{color:'#6b7a99'}, grid:{color:'rgba(255,255,255,.05)'} },
            y1: { position:'right', min:0, max:500, ticks:{color:'#6b7a99'}, grid:{drawOnChartArea:false} } },
          plugins: { legend: { labels: { color: '#e6f1ff', boxWidth: 12 } } } }
      });
    },
    connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      this.ws = new WebSocket(proto + '//' + location.host + '/ws');
      this.ws.onopen = () => { this.wsStatus = 'connected'; };
      this.ws.onclose = () => { this.wsStatus = 'disconnected'; this.scheduleReconnect(); };
      this.ws.onerror = () => { this.wsStatus = 'error'; };
      this.ws.onmessage = (e) => {
        try { this.render(JSON.parse(e.data)); } catch (err) { console.error(err); }
      };
    },
    scheduleReconnect() {
      if (this.reconnectTimer) return;
      this.reconnectTimer = setTimeout(() => { this.reconnectTimer = null; this.connect(); }, 2000);
    },
    render(d) {
      this.cpu = d.cpu; this.mem = d.mem; this.rps = d.req_per_sec; this.lat = d.latency_ms;
      this.events = (d.events || []).slice(-10);
      this.labels.push(new Date(d.ts*1000).toLocaleTimeString());
      this.cpuData.push(d.cpu); this.memData.push(d.mem); this.rpsData.push(d.req_per_sec);
      if (this.labels.length > 30) { this.labels.shift(); this.cpuData.shift(); this.memData.shift(); this.rpsData.shift(); }
      if (this.chart) this.chart.update('none');
      fetch('/api/health').then(r=>r.json()).then(h=>{ this.clients = h.clients; }).catch(()=>{});
    },
    async runAI() {
      this.aiOut = 'Analyzing…';
      try {
        const r = await fetch('/api/ai/analyze', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ events: this.events, metrics: { cpu:this.cpu, mem:this.mem, req_per_sec:this.rps, latency_ms:this.lat } }) });
        const j = await r.json();
        this.aiOut = (j.insights||[]).map(i=>'• '+i).join('\n') + '\n\nStats: ' + JSON.stringify(j.stats);
      } catch (e) { this.aiOut = 'Error: ' + e; }
    }
  };
}
</script>
</body>
</html>
EOF
